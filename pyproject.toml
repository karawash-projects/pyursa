[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyursa"
version = "1.0.1"
description = "Engine-agnostic dataframes for agentic AI: strict types, identical results on Polars and DuckDB, structured errors, undo, lineage, LLM operators and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The pyursa authors" }]
keywords = ["dataframe", "agents", "llm", "mcp", "polars", "duckdb", "arrow", "data-engineering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
polars = ["polars>=1.30"]
duckdb = ["duckdb>=1.2"]
all = ["polars>=1.30", "duckdb>=1.2"]
mcp = ["mcp>=1.21.1", "polars>=1.30", "duckdb>=1.2"]
llm = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
dev = ["polars>=1.30", "duckdb>=1.2", "pytest>=8", "mcp>=1.21.1", "numpy", "pandas", "botocore", "ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/karawash-projects/pyursa"
Documentation = "https://github.com/karawash-projects/pyursa/tree/main/docs"
Changelog = "https://github.com/karawash-projects/pyursa/blob/main/CHANGELOG.md"
Issues = "https://github.com/karawash-projects/pyursa/issues"

[project.scripts]
pyursa-mcp = "pyursa.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyursa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731", "E701", "E702", "E741", "B905", "B008"]
