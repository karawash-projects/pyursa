name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff -e ".[all]"
      - run: ruff check src tests scripts benchmarks
      - name: API reference is up to date
        run: python scripts/gen_api_docs.py --check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: End-to-end script
        run: python scripts/e2e.py --rows 50000

  prerelease-dependencies:
    name: test (newest pre-release dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true  # early warning about upstream changes; doesn't block merges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --pre --upgrade -e ".[dev]"
      - run: pip list
      - run: python -m pytest -q

  journeys:
    name: end-to-end journeys (${{ matrix.os }}, ${{ matrix.deps }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13", deps: latest }
          - { os: ubuntu-latest, python: "3.10", deps: oldest }
          - { os: windows-latest, python: "3.13", deps: latest }
          - { os: macos-latest, python: "3.13", deps: latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install build
      - run: python -m build --wheel -o dist
      - name: Install the built wheel (as a user would)
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          if [ "${{ matrix.deps }}" = "oldest" ]; then
            pip install -c ci/constraints-min.txt "${WHEEL}[all,mcp]" pandas numpy
          else
            pip install "${WHEEL}[all,mcp]" pandas numpy
          fi
          echo "PYURSA_WHEEL=$(pwd)/${WHEEL}" >> "$GITHUB_ENV"
      - name: Run the journeys against the installed package
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/scripts/journeys/run.py"

  minimum-versions:
    name: test (oldest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -c ci/constraints-min.txt -e . pytest numpy pandas polars duckdb mcp
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl polars
          cd /tmp && /tmp/clean/bin/python -c "import pyursa as pu; print(pu.__version__, pu.from_dict({'a': [1]}).count())"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
